<text x="780.0" y="44" class="h1" text-anchor="middle">BOSS SMC BOT — AI ⇄ Bot flow · លំហូររវាង AI និង Bot</text>
<text x="780.0" y="70" class="s" font-size="14" fill="#64748b">left = v2.0 as found (broken) · right = v2.1 fixed · red = defect · orange = cost/risk · green = repaired · purple = AI worker</text>
<text x="330.0" y="94" class="h2" text-anchor="middle">v2.0 — មុន (before)</text>
<rect x="60" y="108" width="540" height="58" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
<text x="330.0" y="132" class="t" font-size="17" fill="#0f172a">Strategy scan — SR_H1 / SMC_MTF / FLASH</text>
<text x="330.0" y="154" class="s" font-size="13.5" fill="#475569">engine picks one candidate per bar</text>
<path d="M 330.0 166 L 330.0 196" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<rect x="60" y="196" width="540" height="58" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
<text x="330.0" y="220" class="t" font-size="17" fill="#0f172a">main.execute_trade()</text>
<text x="330.0" y="242" class="s" font-size="13.5" fill="#475569">AI gate, then deterministic gates</text>
<path d="M 330.0 254 L 330.0 284" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<rect x="60" y="284" width="540" height="58" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="330.0" y="308" class="t" font-size="17" fill="#0f172a">AIReviewer.review()  —  INLINE</text>
<text x="330.0" y="330" class="s" font-size="13.5" fill="#475569">urlopen timeout 8s × retries × appeal, inside the 0.5s loop</text>
<path d="M 330.0 342 L 330.0 372" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<rect x="60" y="372" width="540" height="58" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
<text x="330.0" y="396" class="t" font-size="17" fill="#0f172a">risk checks → place_buy / place_sell</text>
<text x="330.0" y="418" class="s" font-size="13.5" fill="#475569">spread · ML · lot · margin · drawdown</text>
<path d="M 330.0 430 L 330.0 460" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<rect x="60" y="460" width="540" height="58" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
<text x="330.0" y="484" class="t" font-size="17" fill="#0f172a">trade_manager: BE / trailing / TP-tighten</text>
<text x="330.0" y="506" class="s" font-size="13.5" fill="#475569">same thread as the AI call</text>
<path d="M 330.0 518 L 330.0 548" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<rect x="60" y="548" width="540" height="58" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="330.0" y="572" class="t" font-size="17" fill="#0f172a">PositionReviewer.review() — INLINE, 2 votes</text>
<text x="330.0" y="594" class="s" font-size="13.5" fill="#475569">up to 2×8s per open position × 4 symbols</text>
<path d="M 330.0 606 L 330.0 636" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<rect x="60" y="636" width="540" height="58" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="330.0" y="660" class="t" font-size="17" fill="#0f172a">CLOSE / EXTEND applied</text>
<text x="330.0" y="682" class="s" font-size="13.5" fill="#475569">ps['tp'] not updated → TP-tighten undoes EXTEND</text>
<path d="M 330.0 694 L 330.0 724" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<rect x="60" y="724" width="540" height="58" rx="12" fill="#fef3c7" stroke="#c2410c" stroke-width="1.6"/>
<text x="330.0" y="748" class="t" font-size="17" fill="#0f172a">close → trade_log · journal.link_outcome</text>
<text x="330.0" y="770" class="s" font-size="13.5" fill="#475569">journal is written… and never read back</text>
<text x="330.0" y="818" class="s" font-size="14" fill="#b91c1c" text-anchor="middle">🛑 a slow provider freezes break-even, trailing and close-detection</text>
<text x="330.0" y="838" class="s" font-size="14" fill="#b91c1c" text-anchor="middle">🛑 AI_POSITION_ENABLED=True was silently dead (gated on AI_ENABLED)</text>
<text x="330.0" y="858" class="s" font-size="14" fill="#b91c1c" text-anchor="middle">🛑 prompts described protections the config did not have</text>
<text x="330.0" y="878" class="s" font-size="14" fill="#b91c1c" text-anchor="middle">🛑 offline suite shipped failing: 20/43 passing</text>
<text x="1110.0" y="94" class="h2" text-anchor="middle">v2.1 — កែរួច (after)</text>
<rect x="840" y="108" width="540" height="58" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
<text x="1110.0" y="132" class="t" font-size="17" fill="#0f172a">Strategy scan — profile-aware</text>
<text x="1110.0" y="154" class="s" font-size="13.5" fill="#475569">SR_H1 default · SMC_MTF/FLASH opt-in</text>
<path d="M 1110.0 166 L 1110.0 196" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<rect x="840" y="196" width="540" height="58" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="1110.0" y="220" class="t" font-size="17" fill="#0f172a">shared entry gates</text>
<text x="1110.0" y="242" class="s" font-size="13.5" fill="#475569">session · loss breaker · AI cooldown — for EVERY engine</text>
<path d="M 1110.0 254 L 1110.0 284" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<rect x="840" y="284" width="540" height="58" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="1110.0" y="308" class="t" font-size="17" fill="#0f172a">execute_trade → AI bus (submit, non-blocking)</text>
<text x="1110.0" y="330" class="s" font-size="13.5" fill="#475569">returns in microseconds; candidate parked in pending_ai</text>
<path d="M 1110.0 342 L 1110.0 372" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<path d="M 1380 313.0 L 1420 313.0" fill="none" stroke="#6d28d9" stroke-width="2.0" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<rect x="840" y="372" width="540" height="58" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="1110.0" y="396" class="t" font-size="17" fill="#0f172a">AI worker thread (bounded queue, dedupe, TTL)</text>
<text x="1110.0" y="418" class="s" font-size="13.5" fill="#475569">entry gate · position manager · directives — never touches MT5</text>
<path d="M 1110.0 430 L 1110.0 460" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<path d="M 1420 401.0 L 1380 401.0" fill="none" stroke="#6d28d9" stroke-width="2.0" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<rect x="840" y="460" width="540" height="58" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="1110.0" y="484" class="t" font-size="17" fill="#0f172a">verdict lands → freshness re-check</text>
<text x="1110.0" y="506" class="s" font-size="13.5" fill="#475569">same bar · drift ≤ 0.5 ATR · age ≤ 45s · ticket still open</text>
<path d="M 1110.0 518 L 1110.0 548" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<rect x="840" y="548" width="540" height="58" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="1110.0" y="572" class="t" font-size="17" fill="#0f172a">deterministic gates → order</text>
<text x="1110.0" y="594" class="s" font-size="13.5" fill="#475569">spread · COST gate (spread vs stop) · ML · lot · margin</text>
<path d="M 1110.0 606 L 1110.0 636" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<rect x="840" y="636" width="540" height="58" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="1110.0" y="660" class="t" font-size="17" fill="#0f172a">trade_manager + AI EXTEND agree</text>
<text x="1110.0" y="682" class="s" font-size="13.5" fill="#475569">ps['tp']/ps['sl'] updated · TP-tighten stands down</text>
<path d="M 1110.0 694 L 1110.0 724" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<rect x="840" y="724" width="540" height="58" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="1110.0" y="748" class="t" font-size="17" fill="#0f172a">outcome → journal → ai_context.lessons</text>
<text x="1110.0" y="770" class="s" font-size="13.5" fill="#475569">the AI reads its own realised win rate next time</text>
<path d="M 1110.0 782 L 1110.0 812" fill="none" stroke="#334155" stroke-width="2.0" marker-end="url(#ah)"/>
<rect x="840" y="812" width="540" height="58" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="1110.0" y="836" class="t" font-size="17" fill="#0f172a">AI directives: clamped · TTL · persisted</text>
<text x="1110.0" y="858" class="s" font-size="13.5" fill="#475569">TP_SCALE · risk% · cooldown · spread cap — never loss limits</text>
<path d="M 1420 313.0 L 1420 841.0" fill="none" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<path d="M 1420 841.0 L 1380 841.0" fill="none" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<text x="1432" y="577.0" font-size="14" fill="#6d28d9" transform="rotate(90 1432 577.0)" text-anchor="middle">AI ⇄ bot feedback: lessons · contract · directives</text>
<text x="1110.0" y="906" class="s" font-size="14" fill="#15803d" text-anchor="middle">✅ loop stays ~1s whatever the provider does</text>
<text x="1110.0" y="926" class="s" font-size="14" fill="#15803d" text-anchor="middle">✅ flags independent + loudly reported when they cannot run</text>
<text x="1110.0" y="946" class="s" font-size="14" fill="#15803d" text-anchor="middle">✅ AI sees the real contract + its own track record</text>
<text x="1110.0" y="966" class="s" font-size="14" fill="#15803d" text-anchor="middle">✅ every verdict re-checked for freshness before acting</text>
<text x="780.0" y="972" class="h2" text-anchor="middle">តួនាទី AI ទាំង ៣ — the three AI roles, and the limits each one lives inside</text>
<rect x="60" y="988" width="440" height="96" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2.2"/>
<text x="280.0" y="1022" class="t" font-size="17" fill="#0f172a">1 · Entry gate (CRO)</text>
<text x="280.0" y="1040" class="s" font-size="16" fill="#0f172a" font-weight="600">APPROVE / REJECT / WAIT</text>
<text x="280.0" y="1064" class="s" font-size="13.5" fill="#475569">veto only · fail-CLOSED · appeal to a 2nd brain</text>
<rect x="560" y="988" width="440" height="96" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.2"/>
<text x="780.0" y="1022" class="t" font-size="17" fill="#0f172a">2 · Position manager</text>
<text x="780.0" y="1040" class="s" font-size="16" fill="#0f172a" font-weight="600">HOLD / CLOSE / EXTEND</text>
<text x="780.0" y="1064" class="s" font-size="13.5" fill="#475569">2 votes must agree · fail-SAFE = keep protections</text>
<rect x="1060" y="988" width="440" height="96" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.2"/>
<text x="1280.0" y="1022" class="t" font-size="17" fill="#0f172a">3 · Market adaptation</text>
<text x="1280.0" y="1040" class="s" font-size="16" fill="#0f172a" font-weight="600">bounded bot directives</text>
<text x="1280.0" y="1064" class="s" font-size="13.5" fill="#475569">clamped ranges · TTL · never loss limits/DD/margin</text>
</svg>